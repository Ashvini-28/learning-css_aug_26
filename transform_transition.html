<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .b_container{
            display:flex;
            flex-wrap: wrap;
            justify-content:center;
            margin-left:20px;
            padding-top:100px;
        }
        .s_box{
            background-color: blueviolet;
            color:azure;
            border-radius: 10px;
            height:200px;
            width: 200px;
            font-size: 20px;
            padding:20px;
            margin:20px;
            border: 5px solid black;
            transition:transform 10s ease-in;
        }
        .b1:hover{
            transform: translate(125px, 125px);

        }
        .b2:hover{
            transform: translateX(200px);
        }
        .b3:hover{
            transform: translateY(200px);
        }

    </style>
</head>
<body> 
    <!-- div.b_container>div.s_box*6 -->

    <div class="b_container">
        <div class="s_box b1">translate</div>
        <div class="s_box b2">tanslateX</div>
        <div class="s_box b3">translateY</div>
        <div class="s_box b4">rotate</div>
        <div class="s_box b5">skew</div>
        <div class="s_box b6">scale</div>
    </div>
</body>
</html>
