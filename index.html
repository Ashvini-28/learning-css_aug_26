<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            color:rgb(15, 17, 162);
            background-color:rgb(24, 108, 142);
            font-size: 80px;
        }
        h1{
            color:rgb(25, 6, 6)!important;
            background-color:coral !important;
            font-size: 80px !important;
        }
        h2{
            color:blue;
            background-color:rgb(24, 108, 142);
           
        }
    </style>
    <link href="css/style.css" rel="stylesheet"type="text/css">
</head>
<body>
    <!-- external css example -->
     <h4>This is an external css example</h4>


    <!-- internal css example -->
     <h2>Hello Ashu</h2>



<!-- inline css example
     higest priority is given to inline css. if we use inline css then it will override the internal and external css. -->
    
     <h1 style="color:rgb(25, 6, 6);background-color:coral;font-size: 80px;">Welcome to CSS</h1>
     <h1 style="color:rgb(15, 17, 162);background-color:rgb(24, 108, 142);font-size: 80px;">Welcome to CSS</h1>




     </body>
</html>
